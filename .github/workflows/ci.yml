name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

  # Manual runs are full integration checkpoints, never affected-only runs.
  workflow_dispatch:

permissions:
  contents: read

# The default PR checkout is GitHub's tested merge commit. Its explicit SHA
# matches the checked-out source, while the base is the PR target commit.
env:
  TURBO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
  TURBO_HEAD_SHA: ${{ github.sha }}
  TURBO_FORCE_FULL: ${{ github.event_name != 'pull_request' && '1' || '0' }}
  TURBO_TELEMETRY_DISABLED: "1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      test_result: ${{ steps.tests.outcome }}
      test_mode: ${{ steps.tests.outputs.mode }}
      test_work: ${{ steps.tests.outputs.work }}
      matrix_result: ${{ steps.matrix.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify aggregate CI gate
        run: npm run test:ci-gate

      - name: Prove affected task selection on Node 24
        id: matrix
        env:
          TURBO_MATRIX_RECEIPT: ${{ runner.temp }}/turbo-matrix.json
        run: |
          npm run test:turbo-layout
          cat "$TURBO_MATRIX_RECEIPT"

      - name: Test
        id: tests
        shell: bash
        run: |
          if [[ "$TURBO_FORCE_FULL" == "1" ]]; then
            npm test
            printf 'mode=full\nwork=executed\n' >> "$GITHUB_OUTPUT"
          else
            npm run test:firebase-admin-runtime
            TURBO_ALLOW_EMPTY=1 npm run turbo:affected -- test
          fi

      - name: Test Firestore security rules
        run: npm run test:firestore-rules

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  db_core:
    name: DB integration / Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_result: ${{ steps.selection.outcome }}
      selection_guard_result: ${{ steps.selection_guard.outcome }}
      guard_result: ${{ steps.guard.outcome }}
      mode: ${{ steps.selection.outputs.mode }}
      db_local: ${{ steps.selection.outputs.db_local }}
      feature_store: ${{ steps.selection.outputs.feature_store }}
      lifecycle_result: ${{ steps.lifecycle.outcome }}
      db_local_result: ${{ steps.db_local.outcome }}
      cleanup_result: ${{ steps.cleanup.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Plan affected database suites
        id: selection
        env:
          TURBO_PLAN_ONLY: "1"
          TURBO_ALLOW_EMPTY: "1"
          TURBO_PLAN_FILE: ${{ runner.temp }}/turbo-db-plan.json
        run: |
          npm run turbo:affected -- test:db:local test:feature-store:db
          node scripts/turbo/ci-db-selection.mjs "$TURBO_PLAN_FILE"

      - name: Require explicit database selection
        id: selection_guard
        shell: bash
        env:
          DB_LOCAL: ${{ steps.selection.outputs.db_local }}
          FEATURE_STORE: ${{ steps.selection.outputs.feature_store }}
        run: |
          for selected in "$DB_LOCAL" "$FEATURE_STORE"; do
            if [[ "$selected" != "true" && "$selected" != "false" ]]; then
              echo "Missing or invalid database selection; refusing silent skips."
              exit 1
            fi
          done

      - name: Check database target, bootstrap and report guards
        id: guard
        run: npm run test:db:guard

      - name: Verify startup recovery and failure cleanup
        id: lifecycle
        if: ${{ steps.selection.outputs.db_local == 'true' || steps.selection.outputs.feature_store == 'true' }}
        run: npm run test:db:lifecycle

      - name: Verify migration artifacts, catalog contracts and PostgreSQL behavior
        id: db_local
        if: ${{ steps.selection.outputs.db_local == 'true' }}
        run: npm run test:db:local

      - name: Remove disposable PostgreSQL
        id: cleanup
        if: ${{ always() }}
        timeout-minutes: 2
        run: npm run test:db:down

  db_feature_store:
    name: DB integration / Feature store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan_result: ${{ steps.selection.outcome }}
      selection_guard_result: ${{ steps.selection_guard.outcome }}
      mode: ${{ steps.selection.outputs.mode }}
      db_local: ${{ steps.selection.outputs.db_local }}
      feature_store: ${{ steps.selection.outputs.feature_store }}
      feature_store_result: ${{ steps.feature_store.outcome }}
      cleanup_result: ${{ steps.cleanup.outcome }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Plan affected database suites
        id: selection
        env:
          TURBO_PLAN_ONLY: "1"
          TURBO_ALLOW_EMPTY: "1"
          TURBO_PLAN_FILE: ${{ runner.temp }}/turbo-db-plan.json
        run: |
          npm run turbo:affected -- test:db:local test:feature-store:db
          node scripts/turbo/ci-db-selection.mjs "$TURBO_PLAN_FILE"

      - name: Require explicit database selection
        id: selection_guard
        shell: bash
        env:
          DB_LOCAL: ${{ steps.selection.outputs.db_local }}
          FEATURE_STORE: ${{ steps.selection.outputs.feature_store }}
        run: |
          for selected in "$DB_LOCAL" "$FEATURE_STORE"; do
            if [[ "$selected" != "true" && "$selected" != "false" ]]; then
              echo "Missing or invalid database selection; refusing silent skips."
              exit 1
            fi
          done

      - name: Verify feature-store PostgreSQL behavior on standard fixture
        id: feature_store
        if: ${{ steps.selection.outputs.feature_store == 'true' }}
        shell: bash
        env:
          FEATURE_STORE_DB_TIMING: "1"
          TEST_DATABASE_URL: postgresql://dfs_ev_test:dfs_ev_test@127.0.0.1:54329/dfs_ev_test
        run: |
          docker compose --env-file /dev/null --project-name dfs-ev-demo-test -f compose.test.yml up -d --wait --wait-timeout 60
          /usr/bin/time -p node scripts/db/test-db.mjs feature-store

      - name: Remove disposable PostgreSQL
        id: cleanup
        if: ${{ always() }}
        timeout-minutes: 2
        run: npm run test:db:down

  ci:
    # Preserve the required check name; no upstream job may bypass it.
    name: CI
    needs: [app, db_core, db_feature_store]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require successful jobs and accounted execution
        shell: bash
        env:
          APP_RESULT: ${{ needs.app.result }}
          DB_CORE_RESULT: ${{ needs.db_core.result }}
          DB_FEATURE_JOB_RESULT: ${{ needs.db_feature_store.result }}
          FORCE_FULL: ${{ env.TURBO_FORCE_FULL }}
          APP_TEST_RESULT: ${{ needs.app.outputs.test_result }}
          APP_TEST_MODE: ${{ needs.app.outputs.test_mode }}
          APP_TEST_WORK: ${{ needs.app.outputs.test_work }}
          APP_MATRIX_RESULT: ${{ needs.app.outputs.matrix_result }}
          DB_PLAN_RESULT: ${{ needs.db_core.outputs.plan_result }}
          DB_SELECTION_GUARD_RESULT: ${{ needs.db_core.outputs.selection_guard_result }}
          DB_GUARD_RESULT: ${{ needs.db_core.outputs.guard_result }}
          DB_MODE: ${{ needs.db_core.outputs.mode }}
          DB_LOCAL_SELECTED: ${{ needs.db_core.outputs.db_local }}
          FEATURE_STORE_SELECTED: ${{ needs.db_core.outputs.feature_store }}
          DB_LIFECYCLE_RESULT: ${{ needs.db_core.outputs.lifecycle_result }}
          DB_LOCAL_RESULT: ${{ needs.db_core.outputs.db_local_result }}
          FEATURE_STORE_RESULT: ${{ needs.db_feature_store.outputs.feature_store_result }}
          DB_CLEANUP_RESULT: ${{ needs.db_core.outputs.cleanup_result }}
          FEATURE_PLAN_RESULT: ${{ needs.db_feature_store.outputs.plan_result }}
          FEATURE_SELECTION_GUARD_RESULT: ${{ needs.db_feature_store.outputs.selection_guard_result }}
          FEATURE_MODE: ${{ needs.db_feature_store.outputs.mode }}
          FEATURE_PLAN_DB_LOCAL: ${{ needs.db_feature_store.outputs.db_local }}
          FEATURE_PLAN_FEATURE_STORE: ${{ needs.db_feature_store.outputs.feature_store }}
          FEATURE_CLEANUP_RESULT: ${{ needs.db_feature_store.outputs.cleanup_result }}
        run: |
          echo "App checks: $APP_RESULT; DB core: $DB_CORE_RESULT; DB feature store: $DB_FEATURE_JOB_RESULT"
          if [[ "$APP_RESULT" != "success" || "$DB_CORE_RESULT" != "success" || "$DB_FEATURE_JOB_RESULT" != "success" ]]; then
            echo "CI requires App checks and both DB jobs to succeed."
            exit 1
          fi
          refuse() { echo "$1"; exit 1; }
          require_outcome() {
            if [[ "$2" != "$3" ]]; then
              refuse "$1: expected $3, received '$2'."
            fi
          }
          # Raw outcomes retain failures even if continue-on-error is introduced.
          for outcome in "$APP_TEST_RESULT" "$APP_MATRIX_RESULT" "$DB_PLAN_RESULT" "$DB_SELECTION_GUARD_RESULT" "$DB_GUARD_RESULT" "$DB_CLEANUP_RESULT" "$FEATURE_PLAN_RESULT" "$FEATURE_SELECTION_GUARD_RESULT" "$FEATURE_CLEANUP_RESULT"; do
            require_outcome "Mandatory execution" "$outcome" "success"
          done
          if [[ "$DB_MODE" != "$FEATURE_MODE" || "$DB_LOCAL_SELECTED" != "$FEATURE_PLAN_DB_LOCAL" || "$FEATURE_STORE_SELECTED" != "$FEATURE_PLAN_FEATURE_STORE" ]]; then
            refuse "Database jobs disagree on suite selection."
          fi
          for mode in "$APP_TEST_MODE" "$DB_MODE"; do
            if [[ "$mode" != "full" && "$mode" != "affected" ]]; then
              refuse "Missing or invalid selection mode."
            fi
          done
          if [[ "$FORCE_FULL" != "0" && "$FORCE_FULL" != "1" ]]; then
            refuse "Missing or invalid full-check requirement."
          fi
          if [[ "$FORCE_FULL" == "1" && ( "$APP_TEST_MODE" != "full" || "$DB_MODE" != "full" ) ]]; then
            refuse "Main and integration checkpoints require full work."
          fi
          if [[ "$APP_TEST_WORK" != "executed" && !( "$APP_TEST_MODE" == "affected" && "$APP_TEST_WORK" == "intentional-empty" ) ]]; then
            refuse "Application work was not executed or explicitly empty."
          fi
          require_selected() {
            case "$2" in
              true) require_outcome "$1" "$3" "success" ;;
              false) require_outcome "$1 intentionally unselected" "$3" "skipped" ;;
              *) refuse "$1: missing or invalid selection." ;;
            esac
          }
          require_selected "Ordinary DB suite" "$DB_LOCAL_SELECTED" "$DB_LOCAL_RESULT"
          require_selected "Feature-store DB suite" "$FEATURE_PLAN_FEATURE_STORE" "$FEATURE_STORE_RESULT"
          if [[ "$DB_MODE" == "full" && ( "$DB_LOCAL_SELECTED" != "true" || "$FEATURE_STORE_SELECTED" != "true" ) ]]; then
            refuse "Full database selection cannot omit a suite."
          fi
          if [[ "$DB_LOCAL_SELECTED" == "true" || "$FEATURE_STORE_SELECTED" == "true" ]]; then
            require_outcome "DB lifecycle" "$DB_LIFECYCLE_RESULT" "success"
          else
            require_outcome "DB lifecycle intentionally unselected" "$DB_LIFECYCLE_RESULT" "skipped"
          fi
          echo "Execution accounted: app=$APP_TEST_MODE/$APP_TEST_WORK; DB=$DB_MODE, ordinary=$DB_LOCAL_SELECTED, feature-store=$FEATURE_STORE_SELECTED; cleanup succeeded."
