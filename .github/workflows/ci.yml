name: CI

on:
  pull_request:
    branches:
      - main
      # TEMPORARY staging trigger for #140 hosted verification; reverted before the PR.
      - feature/dfsEV-140-ci-db-gating
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # UI/docs-only PRs skip DB integration; docs-only PRs skip both suites;
    # everything else runs both (scripts/ci/affected.mjs). The UI-layer import
    # boundary is enforced by dependency-cruiser in App checks. Pushes to main
    # run everything.
    name: Detect affected suites
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.affected.outputs.app }}
      db: ${{ steps.affected.outputs.db }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Decide which suites this change needs
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/affected.mjs

  app:
    name: App checks
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check architecture boundaries
        run: npm run lint:boundaries

      - name: Verify aggregate CI gate
        run: npm run test:ci-gate

      - name: Test
        run: npm test

      - name: Test Firestore security rules
        run: npm run test:firestore-rules

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  db:
    name: DB integration
    needs: changes
    if: ${{ needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check database target, bootstrap and report guards
        run: npm run test:db:guard

      - name: Verify migration artifacts, catalog contracts and PostgreSQL behavior
        run: npm run test:db:local

      - name: Remove disposable PostgreSQL
        if: ${{ always() }}
        timeout-minutes: 2
        run: npm run test:db:down

  ci:
    # Preserve the required check name. Every needed suite must succeed; a
    # suite may be skipped only when the change detector said it is not needed.
    name: CI
    needs: [changes, app, db]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every needed suite to succeed
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_NEEDED: ${{ needs.changes.outputs.app }}
          APP_RESULT: ${{ needs.app.result }}
          DB_NEEDED: ${{ needs.changes.outputs.db }}
          DB_RESULT: ${{ needs.db.result }}
        run: |
          echo "Detect: $CHANGES_RESULT; App checks: $APP_RESULT (needed: $APP_NEEDED); DB integration: $DB_RESULT (needed: $DB_NEEDED)"
          suite_ok() { [[ ( "$1" == "true" && "$2" == "success" ) || ( "$1" == "false" && "$2" == "skipped" ) ]]; }
          if [[ "$CHANGES_RESULT" != "success" ]] || ! suite_ok "$APP_NEEDED" "$APP_RESULT" || ! suite_ok "$DB_NEEDED" "$DB_RESULT"; then
            echo "CI requires change detection to succeed, every needed suite to succeed, and only unneeded suites to be skipped."
            exit 1
          fi
