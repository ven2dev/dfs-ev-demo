name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Firebase emulator binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Check changed files for whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify aggregate CI gate
        run: npm run test:ci-gate

      - name: Test
        run: npm test

      - name: Test Firestore security rules
        run: npm run test:firestore-rules

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  db:
    name: DB integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check database target guards
        run: npm run test:db:guard

      - name: Test disposable PostgreSQL
        # Validation-only change: prove an incomplete suite fails the DB job and CI gate.
        run: npm run test:db:local -- --testNamePattern='^bootstraps'

      - name: Remove disposable PostgreSQL
        if: ${{ always() }}
        timeout-minutes: 2
        run: npm run test:db:down

  ci:
    # Preserve the required check name; neither upstream job may bypass it.
    name: CI
    needs: [app, db]
    if: ${{ always() }}
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require every upstream job to succeed
        shell: bash
        env:
          APP_RESULT: ${{ needs.app.result }}
          DB_RESULT: ${{ needs.db.result }}
        run: |
          echo "App checks: $APP_RESULT; DB integration: $DB_RESULT"
          if [[ "$APP_RESULT" != "success" || "$DB_RESULT" != "success" ]]; then
            echo "CI requires both App checks and DB integration to succeed."
            exit 1
          fi
